# Credits: oEnzoRibas. Verification only; no production credentials or deployment.
name: Verify frontend
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_API_URL: http://localhost:18080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
